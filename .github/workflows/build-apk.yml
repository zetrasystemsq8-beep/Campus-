name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Add Android platform
        run: |
          flutter create --project-name campus_app --org ng.campus --platforms=android /tmp/scaffold
          cp -r /tmp/scaffold/android app/android
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' app/android/app/src/main/AndroidManifest.xml
      - name: Build
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: campus-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
